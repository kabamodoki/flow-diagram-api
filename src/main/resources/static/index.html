<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>flow-diagram-api プレビュー</title>
<style>
  html,body{margin:0;height:100%;font:14px/1.5 "Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:#2d3748;}
  .wrap{display:flex;height:100vh;}
  .pane-left{width:420px;flex:0 0 420px;display:flex;flex-direction:column;border-right:1px solid #e2e8f0;background:#fff;}
  .pane-right{flex:1 1 auto;overflow:auto;background:#f7f8fa;}
  .head{padding:12px 16px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:8px;}
  .head h1{font-size:15px;margin:0;flex:1;}
  button{font:inherit;padding:6px 14px;border:1px solid #cbd5e0;border-radius:6px;background:#fff;cursor:pointer;}
  button.primary{background:#4a6fa5;border-color:#4a6fa5;color:#fff;}
  button:hover{filter:brightness(.96);}
  textarea{flex:1;border:0;outline:0;padding:14px 16px;resize:none;
    font:13px/1.6 "Cascadia Mono",Consolas,"Courier New",monospace;tab-size:2;}
  .err{display:none;margin:0;padding:10px 16px;background:#fff5f5;color:#c53030;border-top:1px solid #fed7d7;
    white-space:pre-wrap;font-size:12px;}
  .hint{padding:8px 16px;font-size:11px;color:#718096;border-top:1px solid #e2e8f0;background:#fafbfc;}
</style>
</head>
<body>
<div class="wrap">
  <div class="pane-left">
    <div class="head">
      <h1>入力JSON</h1>
      <button type="button" id="btnSample">サンプル</button>
      <button type="button" class="primary" id="btnRender">描画</button>
    </div>
    <textarea id="json" spellcheck="false"></textarea>
    <pre class="err" id="err"></pre>
    <div class="hint">Ctrl + Enter でも描画できます。/api/diagram に同じJSONをPOSTすると1枚もののHTMLが返ります。</div>
  </div>
  <div class="pane-right" id="out"></div>
</div>
<script>
(function () {
  var ta = document.getElementById('json');
  var out = document.getElementById('out');
  var err = document.getElementById('err');

  function showError(text) {
    err.textContent = text;
    err.style.display = 'block';
  }
  function clearError() {
    err.style.display = 'none';
  }

  function loadSample() {
    fetch('/api/sample')
      .then(function (r) { return r.json(); })
      .then(function (j) { ta.value = JSON.stringify(j, stripNulls, 2); render(); })
      .catch(function (e) { showError('サンプルの取得に失敗しました: ' + e); });
  }

  function stripNulls(key, value) {
    if (value === null) return undefined;
    if (Array.isArray(value) && value.length === 0) return undefined;
    return value;
  }

  function render() {
    clearError();
    var body = ta.value;
    try { JSON.parse(body); }
    catch (e) { showError('JSONの構文エラー: ' + e.message); return; }

    fetch('/api/diagram/fragment', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: body
    }).then(function (r) {
      if (!r.ok) {
        return r.json().then(function (j) {
          throw new Error((j.messages || ['不明なエラー']).join('\n'));
        });
      }
      return r.text();
    }).then(function (html) {
      out.innerHTML = html;
    }).catch(function (e) {
      showError(e.message);
    });
  }

  document.getElementById('btnRender').addEventListener('click', render);
  document.getElementById('btnSample').addEventListener('click', loadSample);
  ta.addEventListener('keydown', function (e) {
    if (e.ctrlKey && e.key === 'Enter') { render(); }
  });

  loadSample();
})();
</script>
</body>
</html>
